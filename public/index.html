<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSX Stock Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            text-transform: uppercase;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .stock-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stock-symbol {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .stock-price {
            font-size: 28px;
            font-weight: bold;
        }

        .stock-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .detail-item {
            background: white;
            padding: 10px;
            border-radius: 6px;
        }

        .detail-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }

        .detail-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 18px;
        }

        .alert-section {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 5px solid #2196F3;
        }

        .alert-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📈 PSX Stock Monitor</h1>

        <div class="input-section">
            <input type="text" id="stockSymbol" placeholder="Enter Stock Symbol (e.g., MEBL, ENGRO, HBL)" value="MEBL">
            <button onclick="fetchStockData()">Get Stock Data</button>
        </div>

        <div id="result"></div>

        <div class="alert-section">
            <h3>🔔 Set Price Alert</h3>
            <div class="alert-input">
                <input type="number" id="alertPrice" placeholder="Alert Price">
                <button onclick="setAlert()">Set Alert</button>
            </div>
        </div>
    </div>

    <script>
        let currentStock = null;
        let alertPrice = null;
        let monitoringInterval = null;

        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        async function fetchStockData() {
            const symbol = document.getElementById('stockSymbol').value.trim().toUpperCase();
            const resultDiv = document.getElementById('result');

            if (!symbol) {
                resultDiv.innerHTML = '<div class="error">Please enter a stock symbol</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="loading">Loading stock data...</div>';

            try {
                // Call your Vercel serverless function
                const response = await fetch(`/api/stock?symbol=${symbol}`);

                if (!response.ok) {
                    throw new Error('Stock not found or API error');
                }

                const data = await response.json();
                currentStock = { symbol, data };

                displayStockData(symbol, data);

            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        function displayStockData(symbol, data) {
            const resultDiv = document.getElementById('result');
            const latest = data[data.length - 1];
            const previous = data[data.length - 2] || latest;

            const change = latest.LDCP - previous.LDCP;
            const changePercent = ((change / previous.LDCP) * 100).toFixed(2);
            const priceColor = change >= 0 ? '#28a745' : '#dc3545';

            resultDiv.innerHTML = `
                <div class="stock-card">
                    <div class="stock-header">
                        <div class="stock-symbol">${symbol}</div>
                        <div class="stock-price" style="color: ${priceColor}">
                            Rs. ${latest.LDCP.toFixed(2)}
                        </div>
                    </div>
                    
                    <div style="color: ${priceColor}; font-size: 14px; margin-bottom: 10px;">
                        ${change >= 0 ? '▲' : '▼'} ${Math.abs(change).toFixed(2)} (${changePercent}%)
                    </div>
                    
                    <div class="stock-details">
                        <div class="detail-item">
                            <div class="detail-label">Volume</div>
                            <div class="detail-value">${latest.TVOL.toLocaleString()}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">High</div>
                            <div class="detail-value">Rs. ${latest.HIGH.toFixed(2)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Low</div>
                            <div class="detail-value">Rs. ${latest.LOW.toFixed(2)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Last Update</div>
                            <div class="detail-value">${latest.TS}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function setAlert() {
            if (!currentStock) {
                alert('Please fetch stock data first!');
                return;
            }

            alertPrice = parseFloat(document.getElementById('alertPrice').value);

            if (!alertPrice || alertPrice <= 0) {
                alert('Please enter a valid price');
                return;
            }

            if (monitoringInterval) {
                clearInterval(monitoringInterval);
            }

            alert(`Alert set for ${currentStock.symbol} at Rs. ${alertPrice}`);

            monitoringInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/stock?symbol=${currentStock.symbol}`);
                    const data = await response.json();
                    const latest = data[data.length - 1];

                    if (latest.LDCP >= alertPrice) {
                        showNotification(
                            `${currentStock.symbol} Price Alert!`,
                            `Current price: Rs. ${latest.LDCP} (Target: Rs. ${alertPrice})`
                        );
                        clearInterval(monitoringInterval);
                    }
                } catch (error) {
                    console.error('Monitoring error:', error);
                }
            }, 30000);
        }

        function showNotification(title, message) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body: message, icon: '📈' });
            } else {
                alert(`${title}\n${message}`);
            }
        }

        document.getElementById('stockSymbol').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchStockData();
        });

        window.onload = () => fetchStockData();
    </script>
</body>

</html>
